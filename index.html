    <section class="section">
        <div class="container card">

                <label class="label">Select Font:</label>
                <div class="control has-icons-left">
                    <div class="select is-fullwidth">
                        <select id="fontSelect">
                            <option value="Standard">Standard</option>
                        </select>
                    </div>
                    <span class="icon is-small is-left">
                        <i class="fas fa-font"></i>
                    </span>
                </div>
            </div>
            <div class="field">
                <div class="control">
                    <button class="button is-link" onclick="generateASCII()">
                        <span class="icon">
                            <i class="fas fa-wand-magic-sparkles"></i>
                        </span>
                        <span>Generate</span>
                    </button>
                </div>
            </div>
            <div class="field">
                <div id="asciiOutput"></div>
            </div>
        </div>
    </section>

<div id="notificationModal" class="modal">
    <div class="modal-background"></div>
    <div class="modal-content">
        <div class="box">
            <div class="notification is-warning">
                <span class="icon is-large">
                    <i class="fas fa-exclamation-triangle fa-lg"></i>
                </span>
                <p id="notificationMessage"></p>
            </div>
            <button class="button is-primary is-medium" onclick="closeNotificationModal()">OK</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/figlet"></script>
<script src="script.js"></script>

<script>
function toggleFontSelect() {
    const artType = document.getElementById("artType").value;
    const fontField = document.getElementById("fontField");

    if (artType === "figlet") {
        fontField.style.display = "block";
    } else {
        fontField.style.display = "none";
    }
}
</script>

</body>
</html>
